<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Question Paper Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
</head>

<body>
    <div id="ai-welcome">
        <div class="ai-panel">
            

            <div class="welcome_header">
                <img src="{{ url_for('static',filename='img.webp') }}" alt="Question Paper Generator"
                    class="header_image">
                <h1>QUESTION PAPER GENERATOR</h1>

            </div>


            <div class="ai-scan-line"></div>

            <p class="ai-desc">
                This platform is designed to help you practice efficiently through paper generated from past question
                papers
            </p>

            <button class="ai-enter" onclick="enterPlatform()">
                Proceed to Dashboard
            </button>
        </div>
    </div>
    <div class="container">
        <div class="form-header">
            <img src="{{ url_for('static',filename='question_paper_generator.jpeg') }}" alt="Question Paper Generator"
                class="header-image">
            <h1>QUESTION PAPER GENERATOR</h1>
        </div>

        <form method="POST">

            <!-- Subject -->
            <label>Subject</label>
            <select name="subject" required>
                <option value="">-- Select Subject --</option>
                <option value="BCE(3110004)">BCE(3110004)</option>
                <option value="BE(3110016)">BE(3110016)</option>
                <option value="BEE(3110005)">BEE(3110005)</option>
                <option value="BME(3110006)">BME(3110006)</option>
                <option value="ETC(3130004)">ETC(3130004)</option>
                <option value="MATHS_1(3110014)">MATHS 1(3110014)</option>
                <option value="MATHS_2(3110015)">MATHS 2(3110015)</option>
                <option value="PHYSICS(3110011)">PHYSICS(3110011)</option>
                <option value="PPS(3110003)">PPS(3110003)</option>
            </select>

            <br><br>


            <label>Query</label>
            <select id="query_type" name="query_type" required>
                <option value="">-- Select Query--</option>
                <option value="probable">Give me a probable question paper</option>
                <option value="topic">Give questions related to particular topic</option>

            </select>

            <br><br>

            <!-- Topic Input -->
            <!-- Topic Input -->
            <div class="form-group" id="topic_div" style="display:none;">
                <label for="topic">Enter Topic</label>
                <input type="text" id="topic" name="topic" class="input-field" placeholder="e.g. Kirchhoff’s Law">
            </div>

            <!-- Custom Query -->
            <div id="custom_div" style="display:none;">
                <label>Enter your custom query</label>
                <textarea name="custom_query" rows="4" placeholder="Type your custom query here..."></textarea>
            </div>

            <br>

            <div id="loader" class="ai-loader" style="display:none;">

                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>

                <div class="loader-text">
                    <span id="loadingText">Initializing</span>
                    <div class="dots">
                        <span>.</span>
                        <span>.</span>
                        <span>.</span>
                    </div>
                </div>

                <div class="progress-bar"></div>
            </div>
            <div id="successCheck" class="success-container" style="display:none;">
                <div class="checkmark-circle">
                    <svg viewBox="0 0 52 52">
                        <path class="checkmark" fill="none" d="M14 27l7 7 17-17" />
                    </svg>
                </div>
                <p>Generated Successfully</p>
            </div>

            <button type="submit">Generate</button>
        </form>

        <br>

        {% if response %}
        <div class="output">
            <pre>{{ response }}</pre>
        </div>
        {% endif %}

        <button class="download-btn" id="downloadBtn">
            Download PDF
        </button>

    </div>
</body>

</html>
